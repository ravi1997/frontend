services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      # optional but helps file watching on some systems:
      # CHOKIDAR_USEPOLLING: "true"
      # WATCHPACK_POLLING: "true"
      # The CMD is now handled by the Dockerfile which is optimized with caching
    networks:
      - app_net

networks:
  app_net:
    external: true
