# Test Master Configuration File
# Comprehensive Automated Testing Orchestration System

execution_config:
  app_url: "http://localhost:3000"
  base_url: "/"
  timeout: 30000  # 30 seconds default timeout
  headless: false
  screenshot_on_failure: true
  
persona_generation:
  total_personas: 25
  selected_personas: 5
  ensure_diversity: true
  include_accessibility: true
  include_security_focused: true
  random_seed: null  # Set to specific number for reproducible results
  
test_types:
  - unit_tests
  - integration_tests
  - system_tests
  - regression_tests
  - ui_tests
  - impression_tests
  - usability_tests
  - exploratory_tests
  - performance_tests
  - security_tests
  - accessibility_tests
  - expected_failure_cases
  
quality_gates:
  logic_correctness: 100
  static_analysis: 0
  build_integrity: "no_warnings"
  code_hygiene: "no_new_todos"
  coverage: 80
  
output_format:
  persona_reports: markdown
  manager_report: markdown
  include_screenshots: true
  include_execution_logs: true
  include_performance_metrics: true
  
agent_os_integration:
  enabled: true
  state_files:
    project_state: "agent/09_state/PROJECT_STATE.md"
    test_state: "agent/09_state/TEST_STATE.md"
    backlog_state: "agent/09_state/BACKLOG_STATE.md"
  gates:
    global_quality: "agent/05_gates/global/gate_global_quality.md"
    testing_rules: "agent/11_rules/testing_rules.md"
  
paths:
  personas_dir: "test_master/personas"
  test_suites_dir: "test_master/test_suites"
  execution_logs_dir: "test_master/execution_logs"
  screenshots_dir: "test_master/screenshots"
  reports_dir: "test_master/reports"
  artifacts_dir: "test_master/artifacts"
  continuity_dir: "test_master/continuity"
  plans_dir: "plans"
  
playwright_config:
  browser: "chromium"  # chromium, firefox, webkit
  viewport:
    width: 1280
    height: 720
  slow_mo: 0
  trace: "retain-on-failure"
  video: "retain-on-failure"
  
retry_config:
  max_retries: 3
  retry_delay: 1000  # milliseconds
  retry_on_timeout: true
  retry_on_network_error: true
  
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "test_master/execution_logs/test_master.log"
  
continuity:
  enabled: true
  auto_save_interval: 60  # seconds
  snapshot_dir: "test_master/continuity"
  
performance:
  enable_metrics: true
  enable_profiling: false
  slow_threshold: 5000  # milliseconds
  
security:
  enable_security_tests: true
  scan_for_vulnerabilities: true
  check_input_validation: true
  
accessibility:
  enable_a11y_tests: true
  wcag_level: "AA"  # A, AA, AAA
  screen_reader_testing: true
  
reporting:
  generate_persona_reports: true
  generate_manager_report: true
  include_bug_reports: true
  include_recommendations: true
  include_screenshots: true
  include_performance_metrics: true
  
features:
  # Flutter Form Management System Features
  - name: "Analytics Dashboard"
    path: "/analytics"
    priority: "High"
  - name: "Form Publishing"
    path: "/publish"
    priority: "Critical"
  - name: "Version History"
    path: "/versions"
    priority: "Medium"
  - name: "Field Library"
    path: "/fields"
    priority: "High"
  - name: "Conditional Logic"
    path: "/logic"
    priority: "High"
  - name: "Digital Signature"
    path: "/signature"
    priority: "Medium"
  - name: "Workflow Engine"
    path: "/workflows"
    priority: "High"
  - name: "Form Templates"
    path: "/templates"
    priority: "Medium"
  - name: "Bulk Translator"
    path: "/translator"
    priority: "Low"
  - name: "Offline Mode"
    path: "/offline"
    priority: "Medium"
